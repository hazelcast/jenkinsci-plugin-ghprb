name: Do Release

on:
  workflow_dispatch:
    inputs:
      next-snapshot-version:
        required: false
        description: 'See https://github.com/hazelcast/maven-release-tooling/blob/main/release/action.yml'

jobs:
  do-release:
    if: github.repository_owner == 'hazelcast'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup JDK
      uses: actions/setup-java@v6
      with:
        java-version: 8
        distribution: 'adopt'
        server-id: ossrh
        server-username-env-var: MAVEN_USERNAME
        server-password-env-var: MAVEN_PASSWORD
        gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
        cache: 'maven'

    - uses: hazelcast/maven-release-tooling/release@main
      with:
        next-snapshot-version: ${{ inputs.next-snapshot-version }}
      env:
        MAVEN_ARGS: --activate-profiles release 
        MAVEN_USERNAME: ${{ secrets.SONATYPE_OSS_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.SONATYPE_OSS_PASSWORD }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
